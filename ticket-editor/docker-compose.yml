services:
  editor:
    build:
      context: ..
      dockerfile: ticket-editor/Dockerfile
    image: ticket-editor
    ports:
      - "4310:4310"
    environment:
      BIND_HOST: 0.0.0.0
      PDF_TOOLING_ADDR: pdf-tooling:50052
    volumes:
      - ./data/templates:/app/data/templates
    depends_on:
      pdf-tooling:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4310/api/print_template/1').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  pdf-tooling:
    build:
      context: ..
      dockerfile: docker/pdf-tooling/Dockerfile
    image: pdf-tooling
    expose:
      - "50052"
    healthcheck:
      test: ["CMD", "/usr/local/bin/tcpcheck"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
