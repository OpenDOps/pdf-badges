name: Release

on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (x.x.x, x.x.x-alpha.N, x.x.x-beta.N, or x.x.x-rc.N)
        required: true
        type: string
      upgrade_probe:
        description: Marker letter A/B/C (empty = shipping; bakes RUST_REG_UPGRADE_PROBE + form /testpath)
        required: false
        type: string
        default: ""
      linux:
        description: Linux
        type: boolean
        default: true
      mac:
        description: macOS
        type: boolean
        default: true
      windows:
        description: Windows
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.version || 'tag' }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LINUX: ${{ inputs.linux }}
          INPUT_MAC: ${{ inputs.mac }}
          INPUT_WINDOWS: ${{ inputs.windows }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            branch="$REF_NAME"
          else
            version="${REF_NAME#release-}"
            branch="$DEFAULT_BRANCH"
          fi
          version_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'
          if [[ ! "$version" =~ $version_re ]]; then
            echo "version must be x.x.x, x.x.x-alpha.N, x.x.x-beta.N, or x.x.x-rc.N, got: ${version}" >&2
            exit 1
          fi

          include=()
          selected() {
            if [[ "$EVENT_NAME" != "workflow_dispatch" || "$1" == "true" ]]; then
              include+=("{\"platform\":\"$2\",\"os\":\"$3\"}")
            fi
          }
          selected "$INPUT_LINUX" linux ubuntu-latest
          selected "$INPUT_LINUX" linux-arm64 ubuntu-24.04-arm
          selected "$INPUT_MAC" macos macos-latest
          selected "$INPUT_MAC" macos-intel macos-15-intel
          selected "$INPUT_WINDOWS" windows windows-latest
          if [[ ${#include[@]} -eq 0 ]]; then
            echo "select at least one system" >&2
            exit 1
          fi
          joined=$(IFS=,; echo "${include[*]}")
          echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"

          python3 - "$version" <<'PY'
          import pathlib, sys
          version = sys.argv[1]
          cargo = pathlib.Path("Cargo.toml")
          lines = cargo.read_text().splitlines(keepends=True)
          in_pkg = False
          written = False
          out = []
          for line in lines:
              if line.startswith("[package]"):
                  in_pkg = True
              elif line.startswith("[") and in_pkg:
                  in_pkg = False
              if in_pkg and not written and line.startswith("version = "):
                  line = f'version = "{version}"\n'
                  written = True
              out.append(line)
          if not written:
              raise SystemExit("Cargo.toml has no package version")
          cargo.write_text("".join(out))

          lock = pathlib.Path("Cargo.lock")
          text = lock.read_text()
          marker = 'name = "rust-reg"\nversion = "'
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Cargo.lock has no rust-reg package")
          value_at = start + len(marker)
          end = text.find('"', value_at)
          text = text[:value_at] + version + text[end:]
          lock.write_text(text)
          PY
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=release-${version}" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "Set the package version to ${version}."
            git push origin "HEAD:${branch}"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  front:
    needs: select
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build the admin app
        run: |
          set -euo pipefail
          npm ci
          npm run build
        working-directory: registration-admin
      - name: Build the operator and kiosk app
        run: |
          set -euo pipefail
          npm ci
          npm run build
        working-directory: registration-form
      - uses: actions/upload-artifact@v7
        with:
          name: frontend
          if-no-files-found: error
          include-hidden-files: true
          path: |
            registration-admin/dist
            registration-form/build/client

  build:
    needs: [select, front]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux pack dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # dpkg-deb for the .deb; libdbus for rust-reg-desk (ksni).
          sudo apt-get install -y dpkg-dev libdbus-1-dev pkg-config
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          version=29.3
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset="protoc-${version}-linux-x86_64.zip" ;;
            Linux-aarch64) asset="protoc-${version}-linux-aarch_64.zip" ;;
            Darwin-arm64) asset="protoc-${version}-osx-aarch_64.zip" ;;
            Darwin-x86_64) asset="protoc-${version}-osx-x86_64.zip" ;;
            MINGW*-*|MSYS*-*|CYGWIN*-*) asset="protoc-${version}-win64.zip" ;;
            *)
              echo "unsupported runner $(uname -s)-$(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${version}/${asset}"
          mkdir -p "$RUNNER_TEMP/protoc"
          if command -v unzip >/dev/null 2>&1; then
            unzip -q protoc.zip -d "$RUNNER_TEMP/protoc"
          else
            tar -xf protoc.zip -C "$RUNNER_TEMP/protoc"
          fi
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          rm protoc.zip
      - name: Test native print for this system
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Linux|Darwin)
              echo "native print: CUPS client"
              ;;
            MINGW*|MSYS*|CYGWIN*)
              echo "native print: spooler client"
              ;;
            *)
              echo "native print: unsupported $(uname -s)" >&2
              exit 1
              ;;
          esac
          cargo test --lib registration_server::native_print
      - name: Test desk wrapper
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_TARGET_DIR
          cargo test --manifest-path desk/Cargo.toml
      - uses: actions/download-artifact@v8
        with:
          name: frontend
          path: .
      - id: pack
        shell: bash
        env:
          REGISTRATION_RELEASE_TAG: v${{ needs.select.outputs.version }}
          REGISTRATION_SKIP_FRONT: "1"
          RUST_REG_UPGRADE_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.upgrade_probe || '' }}
          VERSION: ${{ needs.select.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p target/release/packed
          bash scripts/release/pack.sh | tee "target/release/packed/sha256-${PLATFORM}.txt"
          # Zip and installer lines name real files. File-digest lines
          # (rust-reg-macos, …) are keys only — skip missing paths.
          while read -r _ name; do
            [[ -n "$name" ]] || continue
            if [[ -f "target/release/$name" ]]; then
              cp "target/release/$name" "target/release/packed/$name"
            fi
          done < "target/release/packed/sha256-${PLATFORM}.txt"
          # Step 16: three upgrade zips per platform; no single *-linux.zip / *-macos.zip.
          for part in server wrapper tray; do
            zip="rust-reg-${VERSION}-${PLATFORM}-${part}.zip"
            [[ -f "target/release/packed/$zip" ]] || {
              echo "missing upgrade zip: $zip" >&2
              exit 1
            }
          done
          for legacy in \
            "rust-reg-${VERSION}-linux.zip" \
            "rust-reg-${VERSION}-linux-arm64.zip" \
            "rust-reg-${VERSION}-macos.zip" \
            "rust-reg-${VERSION}-macos-intel.zip" \
            "rust-reg-${VERSION}-windows.zip"
          do
            if [[ -f "target/release/packed/$legacy" || -f "target/release/$legacy" ]]; then
              echo "legacy single upgrade zip must not ship: $legacy" >&2
              exit 1
            fi
          done
          echo "packed platform=${PLATFORM} runner=$(uname -s)-$(uname -m) three-zips=ok"
          ls -la target/release/packed/
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: target/release/packed

  publish:
    needs: [select, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.select.outputs.tag }}
          SHA: ${{ needs.select.outputs.sha }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          set -euo pipefail
          : > dist/SHA256SUMS
          for name in linux linux-arm64 macos macos-intel windows; do
            line="dist/sha256-${name}.txt"
            if [[ -f "$line" ]]; then
              cat "$line" >> dist/SHA256SUMS
            fi
          done
          rm -f dist/sha256-*.txt
          # Drop any pre-step-16 single upgrade zip left from an earlier pack.
          rm -f \
            dist/rust-reg-*-linux.zip \
            dist/rust-reg-*-linux-arm64.zip \
            dist/rust-reg-*-macos.zip \
            dist/rust-reg-*-macos-intel.zip \
            dist/rust-reg-*-windows.zip
          # Keep only names that match a real file under dist/ (not bare globs).
          shopt -s nullglob
          files=(dist/*)
          shopt -u nullglob
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no release files under dist/" >&2
            exit 1
          fi
          if ! grep -E '  rust-reg-.+-(server|wrapper|tray)\.zip$' dist/SHA256SUMS >/dev/null; then
            echo "SHA256SUMS missing three-zip lines" >&2
            exit 1
          fi
          if grep -E '  rust-reg-.+-(linux|linux-arm64|macos|macos-intel|windows)\.zip$' dist/SHA256SUMS >/dev/null; then
            echo "SHA256SUMS still lists a legacy single upgrade zip" >&2
            exit 1
          fi
          echo "publish files:"
          printf '  %s\n' "${files[@]}"
          if [[ "$VERSION" == *-alpha.* || "$VERSION" == *-beta.* || "$VERSION" == *-rc.* ]]; then
            mark=(--prerelease)
          else
            mark=(--prerelease=false)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Remove leftover single-zip assets from an earlier upload of this tag.
            while read -r asset; do
              case "$asset" in
                rust-reg-*-linux.zip|rust-reg-*-linux-arm64.zip|rust-reg-*-macos.zip|rust-reg-*-macos-intel.zip|rust-reg-*-windows.zip)
                  gh release delete-asset "$TAG" "$asset" --yes || true
                  ;;
              esac
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" "${mark[@]}"
          else
            gh release create "$TAG" "${files[@]}" \
              --target "$SHA" \
              --title "$TAG" \
              --notes "rust-reg ${VERSION}" \
              "${mark[@]}"
          fi
