[workspace]
members = [".", "modules/ticket-render"]

[package]
name = "rust-reg"
version = "2.0.0-alpha.1"
edition = "2021"
default-run = "rust-reg"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
lopdf = "0.45.0"
clap = { version = "4.4", features = ["derive"] }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
ttf-parser = "0.25.1"
log = "0.4"
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }
axum = { version = "0.8", features = ["json", "ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls-native-roots"] }
cookie = "0.18"
libc = "0.2"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tonic-reflection = "0.14.6"
futures = "0.3"
httpdate = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
ticket-render = { path = "modules/ticket-render" }

[dev-dependencies]
ttf-parser = "0.25.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }
rqrr = "0.8"

[build-dependencies]
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"

[[test]]
name = "live_remote"
harness = false
