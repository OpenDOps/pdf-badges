[project]
name = "excel-tooling"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.71",
    "grpcio-reflection>=1.71",
    "protobuf>=5.29",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.71",
    "pytest>=8",
    "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["excel_tooling*"]

[tool.pytest.ini_options]
pythonpath = [".", "excel_tooling/gen"]
testpaths = ["tests"]
markers = [
    "libreoffice: requires the LibreOffice Python bridge and a Calc listener",
]
