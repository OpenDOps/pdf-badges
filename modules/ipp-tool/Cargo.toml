[package]
name = "ipp-tool"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cross-platform IPP client for discovery, attributes, and jobs"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
mdns-sd = "0.21.6"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
