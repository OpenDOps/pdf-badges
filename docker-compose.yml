services:
  excel-tooling:
    build: ./modules/excel-tooling
    image: excel-tooling
    expose:
      - "50051"
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/tmp
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

  pdf-tooling:
    build:
      context: .
      dockerfile: docker/pdf-tooling/Dockerfile
    image: pdf-tooling
    ports:
      - "50052:50052"
    networks:
      - private
    healthcheck:
      test: ["CMD", "/usr/local/bin/tcpcheck"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

networks:
  private:
    internal: true
